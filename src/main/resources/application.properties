spring.application.name=FarmaGuard
spring.main.web-application-type=none
spring.main.banner-mode=off

# Base de datos SQLite local. La carpeta la crea FarmaGuardYberiaApplication antes de arrancar Spring
# (por defecto %USERPROFILE%\.farmaguard, escribible aunque la app se instale en Program Files).
spring.datasource.url=jdbc:sqlite:${farmaguard.home:${user.home}/.farmaguard}/farmaguard.db
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite admite un solo escritor: una conexión evita errores "database is locked".
spring.datasource.hikari.maximum-pool-size=1

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# schema.sql y data.sql se ejecutan en cada arranque: son idempotentes
# (CREATE TABLE IF NOT EXISTS / INSERT OR REPLACE) y así el catálogo se actualiza con cada versión.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.data-locations=classpath:db/data.sql
spring.sql.init.encoding=UTF-8

logging.level.root=WARN
logging.level.pe.farmaguard=INFO

